identity:
  name: "OpenClaw Multi-Agent"
  theme: "sistema multi-agente para desenvolvimento colaborativo"
  emoji: "🤖"

gateway:
  port: 18789
  host: 0.0.0.0
  auth:
    token: auto-generate
  trustedProxies: ["127.0.0.1", "10.0.0.0/8", "100.64.0.0/10"]
  # Timeouts e resiliência
  timeouts:
    request: 300s
    connect: 10s
    read: 300s
  # Rate limiting
  rateLimit:
    enabled: true
    requestsPerMinute: 60
    burstSize: 10
  # Health check
  health:
    enabled: true
    path: /health

models:
  defaults:
    provider: ollama
    model: ollama/glm-4.7-flash
  providers:
    ollama:
      apiKey: "ollama-local"
      baseUrl: "http://localhost:11434/v1"
      # Timeouts específicos do provider
      timeout: 300s
      # Retry configuration
      retry:
        enabled: true
        maxRetries: 3
        backoff: exponential
        initialDelay: 1s
        maxDelay: 30s
      models:
        - id: "glm-4.7-flash"
          name: "GLM-4.7-Flash"
          reasoning: true
          input: ["text"]
          cost:
            input: 0
            output: 0
          contextWindow: 32768
          maxTokens: 32768

agents:
  defaults:
    workspace: ".openclaw/workspace"
    model:
      primary: "ollama/glm-4.7-flash"
      fallback: ["ollama/qwen2.5-coder:14b"]
    heartbeat:
      every: "30m"
      target: "last"
    # Timeouts de execução
    execution:
      timeout: 600s
      maxIterations: 50
    tools:
      bash:
        enabled: true
        timeout: 60s
      browser:
        enabled: true
        timeout: 120s
      web:
        enabled: true
        search:
          enabled: true
          timeout: 30s
      files:
        enabled: true
        maxFileSize: 100MB
    # Circuit breaker
    circuitBreaker:
      enabled: true
      failureThreshold: 5
      successThreshold: 3
      timeout: 60s
  list:
    - id: planner
      identity:
        name: "Planner"
        theme: "planejamento e arquitetura de sistemas"
        emoji: "🗺️"
      sandbox:
        mode: "off"
    - id: coder
      identity:
        name: "Coder"
        theme: "desenvolvimento e implementação de código"
        emoji: "💻"
      sandbox:
        mode: "all"
    - id: hacker
      identity:
        name: "Hacker"
        theme: "segurança, testes e hardening"
        emoji: "🔒"
      sandbox:
        mode: "off"
      tools:
        elevated: true

logging:
  level: info
  directory: "/workspace/logs"
  redactSensitive: "tools"
  # Structured logging
  format: json
  # Rotação de logs
  rotation:
    maxSize: 50MB
    maxBackups: 5
    maxAge: 7

memory:
  persistence:
    enabled: true
    directory: "/workspace/.openclaw/memory"
  # Limites de memória
  limits:
    maxConversations: 100
    maxMessagesPerConversation: 1000
    retentionDays: 30

# Observabilidade
observability:
  metrics:
    enabled: true
    path: /metrics
  tracing:
    enabled: true
    sampleRate: 0.1

# Segurança adicional
security:
  audit:
    enabled: true
    logPath: "/workspace/logs/audit.log"
  sandbox:
    image: "node:18-slim"  # Imagem base para sandbox
    setupCommand: "npm install -g @openclaw/sandbox-setup"
