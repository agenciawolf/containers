; =============================================================================
; SUPERVISOR CONFIGURATION - OpenClaw Multi-Agent (DINÂMICO)
; Agentes são gerados em /workspace/.supervisor/agents.conf
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/workspace/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
logfile_maxbytes=50MB
logfile_backups=10

[unix_http_server]
; Socket em /workspace para persistência e acesso via supervisorctl
file=/workspace/.supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///workspace/.supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; =============================================================================
; OLLAMA - Otimizações GPU (variáveis vindas do ambiente)
; =============================================================================
[program:ollama]
command=/usr/local/bin/ollama serve
user=root
environment=HOME="/workspace",OLLAMA_HOST="0.0.0.0",OLLAMA_PORT="11434",OLLAMA_MODELS="/workspace/.ollama/models",OLLAMA_NUM_PARALLEL="%(ENV_OLLAMA_NUM_PARALLEL)s",OLLAMA_MAX_LOADED_MODELS="1",OLLAMA_FLASH_ATTENTION="1",OLLAMA_KV_CACHE_TYPE="%(ENV_OLLAMA_KV_CACHE_TYPE)s",OLLAMA_NUM_GPU="999",OLLAMA_GPU_OVERHEAD="256m",OLLAMA_KEEP_ALIVE="-1",OLLAMA_ORIGINS="*",OLLAMA_DEBUG="false",CUDA_VISIBLE_DEVICES="0",CUDA_LAUNCH_BLOCKING="0"
autostart=true
autorestart=true
startretries=10
startsecs=10
exitcodes=0,2
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/ollama.log
stderr_logfile=/workspace/logs/ollama-error.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5
priority=10

; =============================================================================
; AGENTES OPENCLAW - Incluídos do arquivo dinâmico
; Gerado pelo entrypoint.sh baseado em OPENCLAW_NUM_AGENTS
; =============================================================================
[include]
files = /workspace/.supervisor/agents.conf

; =============================================================================
; EVENT LISTENER - Monitora e reinicia processos
; =============================================================================
[eventlistener:process-monitor]
command=/opt/scripts/process-monitor.sh
user=root
autostart=true
autorestart=true
stdout_logfile=/workspace/logs/process-monitor.log
stderr_logfile=/workspace/logs/process-monitor-error.log
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL,PROCESS_STATE_RUNNING
priority=30
