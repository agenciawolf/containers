[supervisord]
nodaemon=true
user=root
logfile=/workspace/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ollama]
command=/usr/local/bin/ollama serve
user=root
environment=HOME="/workspace",OLLAMA_HOST="0.0.0.0",OLLAMA_PORT="11434",OLLAMA_MODELS="/workspace/.ollama/models",OLLAMA_NUM_PARALLEL="3",OLLAMA_MAX_LOADED_MODELS="1",OLLAMA_FLASH_ATTENTION="1",CUDA_VISIBLE_DEVICES="0"
autostart=true
autorestart=true
stdout_logfile=/workspace/logs/ollama.log
stderr_logfile=/workspace/logs/ollama-error.log
priority=10

[program:openclaw-planner]
command=/workspace/scripts/run-agent.sh planner 18790
user=planner
autostart=true
autorestart=true
stdout_logfile=/workspace/logs/planner.log
stderr_logfile=/workspace/logs/planner-error.log
priority=20
startsecs=5

[program:openclaw-coder]
command=/workspace/scripts/run-agent.sh coder 18791
user=coder
autostart=true
autorestart=true
stdout_logfile=/workspace/logs/coder.log
stderr_logfile=/workspace/logs/coder-error.log
priority=20
startsecs=5

[program:openclaw-hacker]
command=/workspace/scripts/run-agent.sh hacker 18792
user=hacker
autostart=true
autorestart=true
stdout_logfile=/workspace/logs/hacker.log
stderr_logfile=/workspace/logs/hacker-error.log
priority=20
startsecs=5
