[supervisord]
nodaemon=true
user=root
logfile=/workspace/logs/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info
logfile_maxbytes=50MB
logfile_backups=10

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[program:ollama]
command=/usr/local/bin/ollama serve
user=root
environment=HOME="/workspace",OLLAMA_HOST="0.0.0.0",OLLAMA_PORT="11434",OLLAMA_MODELS="/workspace/.ollama/models",OLLAMA_NUM_PARALLEL="3",OLLAMA_MAX_LOADED_MODELS="1",OLLAMA_FLASH_ATTENTION="1",OLLAMA_ORIGINS="*",OLLAMA_KEEP_ALIVE="30m",CUDA_VISIBLE_DEVICES="0"
autostart=true
autorestart=true
startretries=10
startsecs=10
exitcodes=0,2
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/ollama.log
stderr_logfile=/workspace/logs/ollama-error.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=100MB
stderr_logfile_backups=5
priority=10

[program:openclaw-planner]
command=/opt/scripts/run-agent.sh planner 18790
user=planner
environment=OPENCLAW_WEB_PASSWORD="%(ENV_OPENCLAW_WEB_PASSWORD)s"
autostart=true
autorestart=true
startretries=5
startsecs=10
exitcodes=0,2
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/planner.log
stderr_logfile=/workspace/logs/planner-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=20

[program:openclaw-coder]
command=/opt/scripts/run-agent.sh coder 18791
user=coder
environment=OPENCLAW_WEB_PASSWORD="%(ENV_OPENCLAW_WEB_PASSWORD)s"
autostart=true
autorestart=true
startretries=5
startsecs=10
exitcodes=0,2
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/coder.log
stderr_logfile=/workspace/logs/coder-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=20

[program:openclaw-hacker]
command=/opt/scripts/run-agent.sh hacker 18792
user=hacker
environment=OPENCLAW_WEB_PASSWORD="%(ENV_OPENCLAW_WEB_PASSWORD)s"
autostart=true
autorestart=true
startretries=5
startsecs=10
exitcodes=0,2
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/hacker.log
stderr_logfile=/workspace/logs/hacker-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=3
priority=20

; Event listener para monitorar e reiniciar processos com backoff
[eventlistener:process-monitor]
command=/opt/scripts/process-monitor.sh
user=root
autostart=true
autorestart=true
stdout_logfile=/workspace/logs/process-monitor.log
stderr_logfile=/workspace/logs/process-monitor-error.log
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL,PROCESS_STATE_RUNNING
priority=30
